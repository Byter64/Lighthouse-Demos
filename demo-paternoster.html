<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paternoster Motion</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#141b2b;--line:#303b58;--text:#f7f8ff;--muted:#aab5cc;--accent:#73ebc5;--warm:#ffcf70}*{box-sizing:border-box}html,body{min-width:320px;min-height:100%;margin:0}body{color:var(--text);background:radial-gradient(circle at 50% -10%,#233254,transparent 38rem),var(--bg);font-family:system-ui,sans-serif}.shell{width:min(100% - 28px,1100px);margin:auto;padding:24px 0 42px}.top{display:flex;justify-content:space-between;align-items:center}.back{color:var(--muted);text-decoration:none}.state{padding:6px 10px;color:var(--accent);background:#123b34;border:1px solid #28685b;border-radius:99px;font-size:.72rem;font-weight:850;text-transform:uppercase}header{margin:38px 0 24px}.eyebrow{margin:0 0 8px;color:var(--accent);font-size:.75rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:clamp(2.4rem,7vw,4.8rem);line-height:.95;letter-spacing:-.055em}.intro{max-width:650px;margin:16px 0 0;color:var(--muted);line-height:1.6}.layout{display:grid;grid-template-columns:250px 1fr;gap:16px}.controls,.stage{background:#141b2bf0;border:1px solid var(--line);border-radius:18px}.controls{display:grid;align-content:start;gap:20px;padding:20px}.control{display:grid;gap:8px}.label-row{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;font-weight:750}output{color:var(--text);font-variant-numeric:tabular-nums}input{width:100%;accent-color:var(--accent)}.pause{min-height:44px;color:#071a17;background:var(--accent);border:0;border-radius:10px;font-weight:850;cursor:pointer}.note{margin:0;color:var(--muted);font-size:.74rem;line-height:1.5}.stage{position:relative;min-width:0;min-height:590px;overflow:hidden}canvas{display:block;width:100%;height:100%;min-height:590px}.legend{position:absolute;right:14px;bottom:12px;color:var(--muted);font-size:.7rem}@media(max-width:740px){.layout{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.pause,.note{grid-column:1/-1}.stage,canvas{min-height:520px}}@media(max-width:440px){.controls{grid-template-columns:1fr}.pause,.note{grid-column:auto}.stage,canvas{min-height:460px}}
</style></head><body><main class="shell">
<nav class="top"><a class="back" href="index.html">&larr; All demos</a><span class="state" id="state">Running</span></nav>
<header><p class="eyebrow">Movement study</p><h1>Paternoster</h1><p class="intro">Cabins stay upright while circulating along two straight sides joined by smooth bows. Adjust the system live to study spacing and motion.</p></header>
<section class="layout"><aside class="controls" aria-label="Paternoster variables">
<label class="control"><span class="label-row"><span>Speed</span><output id="speed-value"></output></span><input id="speed" type="range" min="0" max="500" value="70" step="5"></label>
<label class="control"><span class="label-row"><span>Number of cells</span><output id="count-value"></output></span><input id="count" type="range" min="1" max="60" value="8"></label>
<label class="control"><span class="label-row"><span>Cell width</span><output id="width-value"></output></span><input id="cell-width" type="range" min="10" max="200" value="52" step="2"></label>
<label class="control"><span class="label-row"><span>Cell height</span><output id="height-value"></output></span><input id="cell-height" type="range" min="10" max="240" value="68" step="2"></label>
<label class="control"><span class="label-row"><span>Track width</span><output id="track-width-value"></output></span><input id="track-width" type="range" min="100" max="1200" value="420" step="10"></label>
<label class="control"><span class="label-row"><span>Track height</span><output id="track-height-value"></output></span><input id="track-height" type="range" min="100" max="1000" value="400" step="10"></label>
<button class="pause" id="pause">Pause motion</button><p class="note">Cell 1 is highlighted so its complete circuit is easy to follow.</p>
</aside><div class="stage"><canvas id="demo" aria-label="Paternoster cells moving clockwise around a capsule-shaped path"></canvas><p class="legend">Clockwise capsule circuit</p></div></section>
</main><script>
const canvas=document.querySelector('#demo'),ctx=canvas.getContext('2d'),controls={speed:document.querySelector('#speed'),count:document.querySelector('#count'),width:document.querySelector('#cell-width'),height:document.querySelector('#cell-height'),trackWidth:document.querySelector('#track-width'),trackHeight:document.querySelector('#track-height')},outputs={speed:document.querySelector('#speed-value'),count:document.querySelector('#count-value'),width:document.querySelector('#width-value'),height:document.querySelector('#height-value'),trackWidth:document.querySelector('#track-width-value'),trackHeight:document.querySelector('#track-height-value')},pause=document.querySelector('#pause'),state=document.querySelector('#state');let vw=0,vh=0,distance=0,last=performance.now(),running=true;
function settings(){return{speed:+controls.speed.value,count:+controls.count.value,w:+controls.width.value,h:+controls.height.value,trackWidth:+controls.trackWidth.value,trackHeight:+controls.trackHeight.value}}
function resize(){const b=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);vw=b.width;vh=b.height;canvas.width=Math.round(vw*d);canvas.height=Math.round(vh*d);ctx.setTransform(d,0,0,d,0,0)}
function track(s){const padding=48,scale=Math.min(1,(vw-padding*2)/(s.trackWidth+s.w),(vh-padding*2)/(s.trackHeight+s.h)),w=s.trackWidth,h=s.trackHeight,drawW=w*scale,drawH=h*scale,left=(vw-drawW)/2,top=(vh-drawH)/2,rx=w/2,ry=Math.min(w/2,h*.32),steps=48,points=[{x:0,y:ry}];for(let i=1;i<=steps;i++){const angle=Math.PI+i*Math.PI/steps;points.push({x:rx+Math.cos(angle)*rx,y:ry+Math.sin(angle)*ry})}points.push({x:w,y:h-ry});for(let i=1;i<=steps;i++){const angle=i*Math.PI/steps;points.push({x:rx+Math.cos(angle)*rx,y:h-ry+Math.sin(angle)*ry})}points.push({x:0,y:ry});const lengths=[0];for(let i=1;i<points.length;i++)lengths.push(lengths[i-1]+Math.hypot(points[i].x-points[i-1].x,points[i].y-points[i-1].y));return{left,top,right:left+drawW,bottom:top+drawH,w,h,drawW,drawH,scale,points,lengths,p:lengths.at(-1)}}
function pointAt(position,t){const d=((position%t.p)+t.p)%t.p;let low=1,high=t.lengths.length-1;while(low<high){const middle=(low+high)>>1;if(t.lengths[middle]<d)low=middle+1;else high=middle}const end=low,start=end-1,span=t.lengths[end]-t.lengths[start]||1,mix=(d-t.lengths[start])/span,a=t.points[start],b=t.points[end];return{x:t.left+(a.x+(b.x-a.x)*mix)*t.scale,y:t.top+(a.y+(b.y-a.y)*mix)*t.scale}}
function arrow(x,y,r){ctx.save();ctx.translate(x,y);ctx.rotate(r);ctx.fillStyle='#73809f';ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-6,-5);ctx.lineTo(-3,0);ctx.lineTo(-6,5);ctx.closePath();ctx.fill();ctx.restore()}
function draw(){const s=settings(),t=track(s);ctx.clearRect(0,0,vw,vh);function trace(){ctx.beginPath();t.points.forEach((point,index)=>{const x=t.left+point.x*t.scale,y=t.top+point.y*t.scale;index?ctx.lineTo(x,y):ctx.moveTo(x,y)})}trace();ctx.strokeStyle='#303b58';ctx.lineWidth=Math.max(4,12*t.scale);ctx.lineJoin='round';ctx.stroke();trace();ctx.strokeStyle='#596782';ctx.lineWidth=2;ctx.stroke();arrow((t.left+t.right)/2,t.top,0);arrow(t.right,(t.top+t.bottom)/2,Math.PI/2);arrow((t.left+t.right)/2,t.bottom,Math.PI);arrow(t.left,(t.top+t.bottom)/2,-Math.PI/2);for(let i=0;i<s.count;i++){const p=pointAt(distance+i*t.p/s.count,t),focus=i===0,w=s.w*t.scale,h=s.h*t.scale;ctx.fillStyle=focus?'#ffd166':'#1f806c';ctx.strokeStyle=focus?'#fff1c7':'#73ebc5';ctx.lineWidth=focus?3:2;ctx.beginPath();ctx.roundRect(p.x-w/2,p.y-h/2,w,h,Math.min(6,Math.min(w,h)/4));ctx.fill();ctx.stroke();ctx.fillStyle=focus?'#35270b':'#eafff8';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='800 '+Math.max(7,Math.min(16,w*.28))+'px system-ui';ctx.fillText(i+1,p.x,p.y)}}
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(running)distance+=settings().speed*dt;draw();requestAnimationFrame(frame)}
function labels(){outputs.speed.value=controls.speed.value+' px/s';outputs.count.value=controls.count.value;outputs.width.value=controls.width.value+' px';outputs.height.value=controls.height.value+' px';outputs.trackWidth.value=controls.trackWidth.value+' px';outputs.trackHeight.value=controls.trackHeight.value+' px'}
Object.values(controls).forEach(x=>x.addEventListener('input',labels));pause.onclick=()=>{running=!running;pause.textContent=running?'Pause motion':'Resume motion';state.textContent=running?'Running':'Paused'};addEventListener('resize',resize);resize();labels();requestAnimationFrame(frame);
</script></body></html>
