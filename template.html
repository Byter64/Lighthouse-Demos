<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New game demo</title>
  <style>
    /* Keep all styles in this file so the demo remains portable. */
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { color: #fff; background: #101525; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .note { position: fixed; inset: 20px auto auto 20px; margin: 0; }
    a { color: #7ef0cb; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Game demo"></canvas>
  <p class="note">Replace this animation with your mechanic. <a href="index.html">Back to demos</a></p>
  <script>
    // Keep all JavaScript in this file too. No build step is required.
    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    let width = 0, height = 0, startedAt = performance.now();

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      width = innerWidth; height = innerHeight;
      canvas.width = width * dpr; canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function frame(now) {
      const t = (now - startedAt) / 1000;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#7ef0cb';
      ctx.beginPath();
      ctx.arc(width / 2 + Math.cos(t) * 80, height / 2 + Math.sin(t * 1.3) * 50, 24, 0, Math.PI * 2);
      ctx.fill();
      requestAnimationFrame(frame);
    }

    addEventListener('resize', resize);
    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
