<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Independent Timers</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--card:#171e30;--line:#34405e;--text:#f7f8ff;--muted:#aeb7cb;--green:#6ee7bd;--red:#ff6b6b;--yellow:#ffd166}*{box-sizing:border-box}body{min-width:320px;min-height:100vh;margin:0;color:var(--text);background:radial-gradient(circle at 50% -10%,#253455,transparent 34rem),var(--bg);font-family:system-ui,sans-serif}button,input{font:inherit}.shell{width:min(100% - 32px,1000px);margin:auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between}.back{color:var(--muted);text-decoration:none}.count{padding:6px 10px;color:var(--green);background:#123b34;border-radius:99px;font-size:.75rem;font-weight:800}header{margin:55px 0 30px;max-width:680px}.tag{color:var(--green);font-size:.75rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{margin:8px 0 18px;font-size:clamp(2.6rem,7vw,5rem);line-height:.95;letter-spacing:-.055em}header p{color:var(--muted);line-height:1.6}
.creator{display:grid;grid-template-columns:1fr 125px 125px auto;gap:12px;align-items:end;padding:18px;margin-bottom:24px;background:#141a29;border:1px solid var(--line);border-radius:16px}label{display:grid;gap:6px;color:var(--muted);font-size:.78rem;font-weight:750}input{width:100%;height:45px;padding:0 12px;color:var(--text);background:#0c111e;border:1px solid #3d4968;border-radius:9px;outline:none}input:focus{border-color:var(--green)}button{min-height:45px;border:0;border-radius:9px;font-weight:850;cursor:pointer}.create,.add{padding:0 16px;color:#071a17;background:var(--green)}
.timers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.timer{padding:21px;background:var(--card);border:1px solid var(--line);border-radius:17px;transition:.2s}.timer.done{background:#401b25;border-color:var(--red);animation:shake .45s}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}}.head,.readout,.limit{display:flex;justify-content:space-between;align-items:center}.head h2{margin:0;font-size:1.05rem}.remove{min-width:38px;min-height:34px;color:var(--muted);background:transparent;font-size:1.3rem}.readout{align-items:end;margin:22px 0 14px}.time{font-size:clamp(3rem,8vw,4.4rem);font-weight:900;line-height:.85;letter-spacing:-.07em;font-variant-numeric:tabular-nums}.status{color:var(--green);font-size:.72rem;font-weight:900;text-transform:uppercase}.done .status{color:#fff}.track{height:9px;overflow:hidden;background:#080c16;border-radius:99px}.fill{height:100%;background:var(--green);border-radius:99px}.max .fill{background:var(--yellow)}.done .fill{background:var(--red)}.limit{margin:8px 0 18px;color:var(--muted);font-size:.75rem}.max-label{color:var(--yellow);font-weight:900}.controls{display:grid;grid-template-columns:1fr 1.15fr;gap:10px;align-items:end}.add:disabled{color:#7d8599;background:#293044;cursor:not-allowed}.restart{display:none;color:#32141d;background:#fff}.done .controls{grid-template-columns:1fr}.done .amount,.done .add{display:none}.done .restart{display:block}.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(max-width:700px){.creator{grid-template-columns:1fr 1fr}.name{grid-column:1/-1}.timers{grid-template-columns:1fr}}@media(max-width:430px){.creator{grid-template-columns:1fr}.name{grid-column:auto}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main class="shell">
<nav class="top"><a class="back" href="index.html">&larr; All demos</a><span class="count" id="count"></span></nav>
<header><span class="tag">Gameplay system</span><h1>Independent timers</h1><p>Create several countdowns. Add time while they run, tune each add amount, and watch the hard limit stop any overflow.</p></header>
<form class="creator" id="creator"><label class="name">Timer name<input id="name" maxlength="28" value="New timer"></label><label>Start (sec)<input id="start" type="number" min="1" max="300" value="10"></label><label>Maximum (sec)<input id="maximum" type="number" min="1" max="300" value="30"></label><button class="create">+ Create timer</button></form>
<section class="timers" id="timers"></section><p class="empty" id="empty" hidden>No timers. Create one above to begin.</p><div class="sr" id="live" aria-live="assertive"></div>
</main><script>
const list=document.querySelector('#timers'),count=document.querySelector('#count'),empty=document.querySelector('#empty'),live=document.querySelector('#live'),form=document.querySelector('#creator'),nameField=document.querySelector('#name'),startField=document.querySelector('#start'),maxField=document.querySelector('#maximum');let timers=[],nextId=1,last=performance.now();const clamp=(n,a,b)=>Math.min(Math.max(n,a),b);const number=(input,fallback)=>Number.isFinite(Math.round(+input.value))?Math.round(+input.value):fallback;
function recount(){count.textContent=timers.length+' '+(timers.length===1?'TIMER':'TIMERS');empty.hidden=!!timers.length}
function format(ms){let s=Math.max(0,ms)/1000;if(s>=60)return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');return s.toFixed(1)}
function addTimer(name,start,max){max=clamp(Math.max(start,max),1,300);start=clamp(start,1,max);const id=nextId++,t={name:name.trim()||'Timer '+id,left:start*1000,start:start*1000,max:max*1000,add:5,done:false};const el=document.createElement('article');t.el=el;el.className='timer';el.innerHTML='<div class="head"><h2></h2><button class="remove" aria-label="Remove timer">&times;</button></div><div class="readout"><span class="time"></span><span class="status"></span></div><div class="track" role="progressbar" aria-valuemin="0"><div class="fill"></div></div><div class="limit"><span>Hard limit: '+max+' sec</span><span class="max-label"></span></div><div class="controls"><label class="amount">Add amount<input type="number" min="1" max="60" value="5"></label><button class="add">+ 5 seconds</button><button class="restart">Restart timer</button></div>';el.querySelector('h2').textContent=t.name;el.querySelector('.track').setAttribute('aria-valuemax',max);
el.querySelector('.remove').onclick=()=>{timers=timers.filter(x=>x!==t);el.remove();recount()};const input=el.querySelector('.amount input');input.oninput=()=>{t.add=clamp(number(input,1),1,60);el.querySelector('.add').textContent='+ '+t.add+' '+(t.add===1?'second':'seconds')};input.onchange=()=>input.value=t.add;el.querySelector('.add').onclick=()=>{t.left=Math.min(t.max,t.left+t.add*1000);render(t)};el.querySelector('.restart').onclick=()=>{t.left=t.start;t.done=false;el.classList.remove('done');render(t)};timers.push(t);list.append(el);recount();render(t)}
function render(t){const atMax=t.left>=t.max-1,p=t.el.querySelector('.track');t.el.querySelector('.time').textContent=format(t.left);t.el.querySelector('.status').textContent=t.done?"Time's up":atMax?'At maximum':'Running';t.el.querySelector('.fill').style.width=(t.left/t.max*100)+'%';t.el.querySelector('.max-label').textContent=atMax&&!t.done?'MAX':'';t.el.classList.toggle('max',atMax&&!t.done);t.el.querySelector('.add').disabled=t.done||atMax;p.setAttribute('aria-valuenow',(t.left/1000).toFixed(1))}
function frame(now){const dt=Math.min(now-last,100);last=now;for(const t of timers){if(t.done)continue;t.left=Math.max(0,t.left-dt);if(!t.left){t.done=true;t.el.classList.add('done');live.textContent=t.name+": time's up."}render(t)}requestAnimationFrame(frame)}
form.onsubmit=e=>{e.preventDefault();const start=clamp(number(startField,10),1,300),max=Math.max(start,clamp(number(maxField,30),1,300));startField.value=start;maxField.value=max;addTimer(nameField.value,start,max);nameField.value='Timer '+nextId;nameField.select()};addTimer('Power-up',12,30);addTimer('Enemy wave',20,45);requestAnimationFrame(frame);
</script></body></html>
